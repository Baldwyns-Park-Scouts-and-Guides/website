{{/* Cookie consent banner. Analytics stays off unless the visitor clicks Accept. */}}
<div id="cookie-banner" role="dialog" aria-live="polite" aria-label="Cookie consent" hidden
  style="position:fixed;left:1rem;right:1rem;bottom:1rem;z-index:1000;max-width:42rem;margin:0 auto;
  padding:1rem 1.25rem;border-radius:.75rem;background:#1f2937;color:#f9fafb;
  box-shadow:0 10px 25px rgba(0,0,0,.3);font-size:.95rem;line-height:1.5;">
  <p style="margin:0 0 .75rem 0;">
    We would like to use Google Analytics cookies to understand how people use our website. These are optional
    and only set if you accept. See our
    <a href="/privacy/" style="color:#93c5fd;text-decoration:underline;">Privacy Policy</a>.
  </p>
  <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
    <button type="button" id="cookie-accept"
      style="padding:.5rem 1rem;border-radius:.5rem;border:0;background:#f9fafb;color:#1f2937;font-weight:600;cursor:pointer;">
      Accept analytics</button>
    <button type="button" id="cookie-reject"
      style="padding:.5rem 1rem;border-radius:.5rem;border:1px solid #f9fafb;background:transparent;color:#f9fafb;font-weight:600;cursor:pointer;">
      Reject</button>
  </div>
</div>
<script>
  (function () {
    var KEY = "bpsg-cookie-consent";
    var banner = document.getElementById("cookie-banner");
    function get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
    function set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
    function clearGaCookies() {
      document.cookie.split(";").forEach(function (c) {
        var name = c.split("=")[0].trim();
        if (name.indexOf("_ga") === 0) {
          var host = location.hostname;
          document.cookie = name + "=; Max-Age=0; path=/";
          document.cookie = name + "=; Max-Age=0; path=/; domain=." + host.replace(/^www\./, "");
        }
      });
    }
    if (!get()) banner.hidden = false;
    document.getElementById("cookie-accept").addEventListener("click", function () {
      set("granted"); banner.hidden = true;
      if (window.bpsgLoadAnalytics) window.bpsgLoadAnalytics();
    });
    document.getElementById("cookie-reject").addEventListener("click", function () {
      set("denied"); banner.hidden = true; clearGaCookies();
    });
    window.bpsgCookieSettings = function () { banner.hidden = false; };
  })();
</script>
